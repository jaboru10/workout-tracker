spring:
  application:
    name: workout-tracker
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/workout}

app:
  jwt:
    # En producción define esta variable de entorno. Debe tener al menos 32 caracteres.
    secret: ${APP_JWT_SECRET:cambia-esto-por-un-secreto-largo-y-seguro-de-produccion}
    # 30 días: la PWA v3 solo usa el servidor para la copia de seguridad y no
    # tiene sentido pedir login cada semana en el móvil.
    expiration-ms: ${APP_JWT_EXPIRATION_MS:2592000000}
  bootstrap:
    # Opcional: crea este usuario al arrancar si no existe (registro público bloqueado).
    username: ${APP_BOOTSTRAP_USERNAME:}
    password: ${APP_BOOTSTRAP_PASSWORD:}

server:
  port: ${PORT:8080}

logging:
  level:
    org.springframework.data.mongodb: INFO

