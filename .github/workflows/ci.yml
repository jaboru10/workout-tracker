name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y pasar tests (MongoDB real)
        env:
          SPRING_DATA_MONGODB_URI: mongodb://localhost:27017/workout-ci
        run: mvn -B -ntp verify

      - name: Construir la imagen Docker (igual que Railway)
        run: docker build -t workout-tracker:ci .
